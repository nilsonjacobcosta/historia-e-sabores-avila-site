<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ornamentos - Cal &amp; Basalto</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Sprite SVG original (nenhum brasao ou marca real). Tudo usa currentColor:
  defina `color` no elemento pai (ex.: var(--mar), var(--barro), var(--tinta)).
  USO: cole o bloco <svg class="sprite"> logo apos <body> e referencie:
     <svg class="ic" aria-hidden="true"><use href="#orn-rosa"/></svg>
  Fundo de azulejo repetido:  <rect fill="url(#pat-azulejo)" width="100%" height="100%"/>
  (o <pattern> precisa estar no mesmo documento).
-->
<style>
  body{margin:0;padding:16px;background:#F2F4F1;color:#182026;font:16px/1.5 system-ui,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#12171B;color:#E9ECE8}}
  .sprite{position:absolute;width:0;height:0;overflow:hidden}
  .grade{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));max-width:64rem;margin:auto}
  .cel{border:1px solid color-mix(in srgb,currentColor 20%,transparent);border-radius:6px;padding:12px;text-align:center}
  .cel svg{width:100%;height:96px;margin-bottom:6px}
  .cel code{font-size:.8rem}
  .azul{color:#1E3F94}.barro{color:#9C4A1A}.verde{color:#3F6322}
  @media (prefers-color-scheme:dark){.azul{color:#9DB8F2}.barro{color:#E8A064}.verde{color:#A9CC7C}}
</style>
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <!-- 1. AZULEJO: ladrilho 80x80. Estrela de 8 pontas + quartos de circulo nos cantos (estilo hispano-lusitano, desenho proprio) -->
    <symbol id="orn-azulejo" viewBox="0 0 80 80">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
        <rect x=".8" y=".8" width="78.4" height="78.4" opacity=".55"/>
        <path d="M40 8 L47 26 L66 19 L54 34 L72 40 L54 46 L66 61 L47 54 L40 72 L33 54 L14 61 L26 46 L8 40 L26 34 L14 19 L33 26 Z"/>
        <circle cx="40" cy="40" r="7"/>
        <circle cx="40" cy="40" r="2.4" fill="currentColor" stroke="none"/>
        <path d="M0 22 A22 22 0 0 0 22 0 M58 0 A22 22 0 0 0 80 22 M80 58 A22 22 0 0 0 58 80 M22 80 A22 22 0 0 0 0 58" opacity=".8"/>
        <path d="M5 5 Q13 5 13 13 Q5 13 5 5Z M75 5 Q67 5 67 13 Q75 13 75 5Z M5 75 Q13 75 13 67 Q5 67 5 75Z M75 75 Q67 75 67 67 Q75 67 75 75Z" fill="currentColor" stroke="none" opacity=".7"/>
      </g>
    </symbol>
    <pattern id="pat-azulejo" width="80" height="80" patternUnits="userSpaceOnUse" style="color:var(--mar,#1E3F94)"><!-- cor do padrao vem daqui (currentColor dentro de pattern nao herda do uso) -->
      <use href="#orn-azulejo" width="80" height="80"/>
    </pattern>

    <!-- 2. DIVISOR ONDAS (mar): 240x24, repetivel horizontalmente -->
    <symbol id="orn-divisor-ondas" viewBox="0 0 240 24" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M0 12 q10 -10 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
        <path d="M0 18 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" opacity=".45"/>
      </g>
    </symbol>

    <!-- 3. DIVISOR RENDA/BORDADO: losangos com ponto-de-cruz, 240x24 -->
    <symbol id="orn-divisor-renda" viewBox="0 0 240 24" preserveAspectRatio="xMidYMid meet">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 12 H92 M148 12 H234" stroke-dasharray="2 5"/>
        <path d="M120 2 L130 12 L120 22 L110 12 Z"/>
        <path d="M120 7 L125 12 L120 17 L115 12 Z" fill="currentColor"/>
        <path d="M96 12 l6 -6 l6 6 l-6 6 Z M132 12 l6 -6 l6 6 l-6 6 Z" opacity=".7"/>
        <path d="M86 8 l8 8 M86 16 l8 -8 M146 8 l8 8 M146 16 l8 -8" opacity=".55"/>
      </g>
    </symbol>

    <!-- 4. MOLDURA DE FOTO: 200x150, miolo livre (use como <svg> sobreposto; a foto vai por baixo em 20,20,160,110) -->
    <symbol id="orn-moldura" viewBox="0 0 200 150">
      <g fill="none" stroke="currentColor" stroke-linejoin="round">
        <rect x="2" y="2" width="196" height="146" stroke-width="2.4"/>
        <rect x="10" y="10" width="180" height="130" stroke-width="1"/>
        <rect x="18" y="18" width="164" height="114" stroke-width="1.6"/>
        <path d="M2 24 Q24 24 24 2 M176 2 Q176 24 198 24 M198 126 Q176 126 176 148 M24 148 Q24 126 2 126" stroke-width="1.6"/>
        <path d="M100 4 l5 4 l-5 4 l-5 -4Z M100 138 l5 4 l-5 4 l-5 -4Z" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <!-- 5. SELO / BRASAO SIMPLES (inventado): anel com texto, pico, ondas e estrela. 160x160 -->
    <symbol id="orn-selo" viewBox="0 0 160 160">
      <defs><path id="orn-selo-arco" d="M80 80 m-58 0 a58 58 0 1 1 116 0 a58 58 0 1 1 -116 0"/></defs>
      <g fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="80" cy="80" r="76"/><circle cx="80" cy="80" r="46" stroke-width="1.5"/>
        <circle cx="80" cy="80" r="70" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round"/>
        <path d="M50 92 L68 62 L74 70 L80 52 L110 92 Z" fill="currentColor" fill-opacity=".18" stroke-linejoin="round"/>
        <path d="M54 100 q6 -6 13 0 t13 0 t13 0 t13 0" stroke-linecap="round"/>
        <path d="M44 110 q6 -6 13 0 t13 0 t13 0 t13 0 t10 0" stroke-linecap="round" opacity=".55"/>
        <path d="M80 30 l3 7 l8 .5 l-6 5 l2 8 l-7 -4.5 l-7 4.5 l2 -8 l-6 -5 l8 -.5Z" fill="currentColor" stroke="none"/>
      </g>
      <text font-family="'Young Serif',Georgia,serif" font-size="15" letter-spacing="3.4" fill="currentColor">
        <textPath href="#orn-selo-arco" startOffset="50%" text-anchor="middle" transform="rotate(0)">ÁVILA · 1709 · 2026 ·</textPath>
      </text>
    </symbol>

    <!-- 6. ROSA-DOS-VENTOS 120x120 -->
    <symbol id="orn-rosa" viewBox="0 0 120 120">
      <g stroke="currentColor" stroke-linejoin="round" fill="none">
        <circle cx="60" cy="60" r="44" stroke-width="1.2"/><circle cx="60" cy="60" r="38" stroke-width=".8" stroke-dasharray="1 4"/>
        <path d="M60 6 L68 52 L114 60 L68 68 L60 114 L52 68 L6 60 L52 52 Z" fill="currentColor" fill-opacity=".14" stroke-width="1.6"/>
        <path d="M60 6 L68 52 L60 60 Z M60 114 L52 68 L60 60 Z M6 60 L52 52 L60 60 Z M114 60 L68 68 L60 60 Z" fill="currentColor" stroke="none"/>
        <path d="M28 28 L54 54 M92 28 L66 54 M28 92 L54 66 M92 92 L66 66" stroke-width="1.2"/>
      </g>
      <text x="60" y="4.5" text-anchor="middle" font-family="'Young Serif',Georgia,serif" font-size="9" fill="currentColor">N</text>
    </symbol>

    <!-- 7. ILHA DO PICO ESTILIZADA 320x160: cone alto com cume, Faial ao fundo, Sao Jorge a direita, mar -->
    <symbol id="orn-pico" viewBox="0 0 320 160">
      <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="2">
        <path d="M6 120 L70 108 L100 112 L132 100 L158 62 L170 34 L178 28 L186 34 L198 64 L222 92 L250 100 L314 114" fill="currentColor" fill-opacity=".9" stroke="none"/>
        <path d="M170 34 L178 28 L186 34 L181 38 L176 36 Z" fill="var(--cal,#fff)" fill-opacity=".9" stroke="none"/>
        <path d="M60 110 Q76 92 96 106" opacity=".5" stroke="var(--cal,#fff)" stroke-opacity=".5"/>
        <path d="M158 62 L164 70 L170 56 M198 64 L190 72 L186 54" stroke="var(--cal,#fff)" stroke-opacity=".35" stroke-width="1.5"/>
        <path d="M0 132 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
        <path d="M0 144 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" opacity=".5"/>
        <path d="M148 14 q6 -6 12 0 q6 -7 13 0" opacity=".45" stroke-width="1.5"/>
      </g>
    </symbol>

    <!-- 8. CASA / FAZENDA mineira 200x140: telhado de 2 aguas, varanda com colunas, chamine, janelas, palmeira/arvore -->
    <symbol id="orn-casa" viewBox="0 0 200 140">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M18 62 L100 22 L182 62"/><path d="M26 62 H174"/>
        <path d="M150 38 V20 H162 V46"/>
        <path d="M34 62 V120 H166 V62"/>
        <path d="M28 120 H172"/>
        <path d="M34 78 H166" stroke-width="1.4" opacity=".6"/>
        <path d="M44 78 V120 M70 78 V120 M130 78 V120 M156 78 V120" stroke-width="1.8"/>
        <path d="M84 120V104a16 16 0 0 1 32 0v16z"/>
        <path d="M100 88 V120 M84 104 H116" stroke-width="1.2"/>
        <rect x="46" y="48" width="0" height="0"/>
        <path d="M92 50 h16 v10 h-16Z M100 50 v10" stroke-width="1.4"/>
        <path d="M0 132 H200" stroke-width="1.4" stroke-dasharray="2 6" opacity=".6"/>
        <path d="M186 120 V96 M186 96 q-10 -4 -14 -12 M186 96 q10 -4 14 -12 M186 96 q-8 -10 -4 -20 M186 96 q8 -10 4 -20" stroke-width="1.6"/>
      </g>
    </symbol>

    <!-- 9. ICONE PANELA 64x64 (com vapor) -->
    <symbol id="orn-panela" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 30 H50 V46 Q50 56 40 56 H24 Q14 56 14 46 Z"/>
        <path d="M10 34 H14 M50 34 H54"/>
        <path d="M12 30 H52"/>
        <path d="M24 46 H40" opacity=".5"/>
        <path d="M24 8 q-4 5 0 9 t0 8 M34 6 q-4 5 0 9 t0 10 M44 8 q-4 5 0 9 t0 8" stroke-width="2" opacity=".75"/>
      </g>
    </symbol>

    <!-- 10. ICONE COLHER DE PAU 64x64 -->
    <symbol id="orn-colher" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="22" cy="22" rx="11" ry="14" transform="rotate(-40 22 22)"/>
        <path d="M30 31 L56 57"/>
        <path d="M14 16 q4 -4 8 -2" opacity=".5"/>
        <path d="M52 57 L58 51" opacity=".6"/>
      </g>
    </symbol>

    <!-- 11. ICONE ROSCA 64x64 (rosca/bolo-de-anel com acucar) -->
    <symbol id="orn-rosca" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="32" cy="34" rx="26" ry="20"/>
        <ellipse cx="32" cy="34" rx="9" ry="6"/>
        <path d="M14 22 q4 -7 12 -9 M50 22 q-4 -7 -12 -9" opacity=".55"/>
        <path d="M14 38 q8 12 18 12 q10 0 18 -12" opacity=".5"/>
      </g>
      <g fill="currentColor"><circle cx="20" cy="28" r="1.6"/><circle cx="30" cy="22" r="1.6"/><circle cx="43" cy="24" r="1.6"/><circle cx="48" cy="34" r="1.6"/><circle cx="16" cy="36" r="1.6"/><circle cx="38" cy="47" r="1.6"/><circle cx="24" cy="46" r="1.6"/></g>
    </symbol>

    <!-- 12. ICONE AVISO "a confirmar" 32x32 (lupa com interrogacao) -->
    <symbol id="orn-confirmar" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="14" cy="14" r="9"/><path d="M21 21 L29 29"/><path d="M11 11.5 q0 -3 3 -3 t3 3 q0 2 -3 3.5 v1.5"/>
      </g><circle cx="14" cy="19.2" r="1.2" fill="currentColor"/>
    </symbol>

    <!-- 13. MARCA DO CABECALHO 48x48: azulejo-estrela dentro de losango -->
    <symbol id="orn-marca" viewBox="0 0 48 48">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <rect x="6" y="6" width="36" height="36" transform="rotate(45 24 24)"/>
        <path d="M24 11 L27 21 L37 24 L27 27 L24 37 L21 27 L11 24 L21 21 Z" fill="currentColor"/>
      </g>
    </symbol>
  </defs>
</svg>

<h1 style="font:400 1.6rem/1.2 Georgia,serif;text-align:center">Ornamentos &middot; Cal &amp; Basalto</h1>
<div class="grade">
  <div class="cel azul"><svg role="img" aria-label="Azulejo"><use href="#orn-azulejo"/></svg><code>#orn-azulejo</code></div>
  <div class="cel azul"><svg role="img" aria-label="Padrão de azulejos repetido"><rect width="100%" height="100%" fill="url(#pat-azulejo)"/></svg><code>#pat-azulejo</code></div>
  <div class="cel azul"><svg role="img" aria-label="Divisor de ondas"><use href="#orn-divisor-ondas"/></svg><code>#orn-divisor-ondas</code></div>
  <div class="cel barro"><svg role="img" aria-label="Divisor de renda"><use href="#orn-divisor-renda"/></svg><code>#orn-divisor-renda</code></div>
  <div class="cel azul"><svg role="img" aria-label="Moldura de foto"><use href="#orn-moldura"/></svg><code>#orn-moldura</code></div>
  <div class="cel azul"><svg role="img" aria-label="Selo"><use href="#orn-selo"/></svg><code>#orn-selo</code></div>
  <div class="cel barro"><svg role="img" aria-label="Rosa-dos-ventos"><use href="#orn-rosa"/></svg><code>#orn-rosa</code></div>
  <div class="cel"><svg role="img" aria-label="Ilha do Pico estilizada"><use href="#orn-pico"/></svg><code>#orn-pico</code></div>
  <div class="cel verde"><svg role="img" aria-label="Casa de fazenda"><use href="#orn-casa"/></svg><code>#orn-casa</code></div>
  <div class="cel barro"><svg role="img" aria-label="Panela"><use href="#orn-panela"/></svg><code>#orn-panela</code></div>
  <div class="cel barro"><svg role="img" aria-label="Colher"><use href="#orn-colher"/></svg><code>#orn-colher</code></div>
  <div class="cel barro"><svg role="img" aria-label="Rosca"><use href="#orn-rosca"/></svg><code>#orn-rosca</code></div>
  <div class="cel barro"><svg role="img" aria-label="Aviso: a confirmar"><use href="#orn-confirmar"/></svg><code>#orn-confirmar</code></div>
  <div class="cel azul"><svg role="img" aria-label="Marca"><use href="#orn-marca"/></svg><code>#orn-marca</code></div>
</div>
</body>
</html>
